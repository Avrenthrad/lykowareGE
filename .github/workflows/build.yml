name: Build foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
      - name: Test
        run: ctest --preset windows-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
      - name: Stage executable
        run: cmake --install build/windows --config ${{ matrix.configuration }} --prefix out/windows-${{ matrix.configuration }}
      - name: Run staged executable
        run: ./out/windows-${{ matrix.configuration }}/bin/lykoware_sandbox.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lykowareGE-windows-x64-${{ matrix.configuration }}
          path: out/windows-${{ matrix.configuration }}/
          if-no-files-found: error

  linux:
    name: Linux portability check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake --preset linux-debug
      - name: Build
        run: cmake --build --preset linux-debug
      - name: Test
        run: ctest --preset linux-debug
