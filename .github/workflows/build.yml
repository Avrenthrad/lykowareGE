name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload Windows builds (requires available artifact storage)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
      - name: Test
        run: ctest --preset windows-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
      - name: Stage executables
        run: cmake --install build/windows --config ${{ matrix.configuration }} --prefix out/windows-${{ matrix.configuration }}
      - name: Run staged executables
        run: |
          # Expected nonzero lyko exits must not fail the pwsh step by themselves.
          $PSNativeCommandUseErrorActionPreference = $false
          function Assert-Exit([int]$Expected) {
            if ($LASTEXITCODE -ne $Expected) {
              Write-Error "expected exit $Expected, got $LASTEXITCODE"
              exit 1
            }
          }
          ./out/windows-${{ matrix.configuration }}/bin/lykoware_sandbox.exe
          Assert-Exit 0
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe --version
          Assert-Exit 0
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe test --source . --preset windows-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
          Assert-Exit 0
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe run
          Assert-Exit 0
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe screenshot
          Assert-Exit 3
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe trace
          Assert-Exit 2
          $trace = Join-Path $env:RUNNER_TEMP "lykoware-cpu-trace.json"
          if (Test-Path $trace) { Remove-Item $trace }
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe trace --frames 2 --output $trace
          Assert-Exit 0
          if (-not (Select-String -Path $trace -Pattern '"name":"sandbox.frame"' -SimpleMatch -Quiet)) {
            Write-Error "trace file is missing sandbox frames"
            exit 1
          }
          Remove-Item $trace
          ./out/windows-${{ matrix.configuration }}/bin/lyko.exe run --scene
          Assert-Exit 3
          exit 0
      # Upload is opt-in and best-effort. The account's Actions artifact quota
      # can reject CreateArtifact even when the build, tests, and staged run
      # succeeded. That quota failure must not hide a green foundation check.
      # Uploads run only on a manual workflow_dispatch with upload_artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        continue-on-error: true
        with:
          name: lykowareGE-windows-x64-${{ matrix.configuration }}
          path: out/windows-${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-sanitizers, linux-analysis]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The Vulkan loader, Khronos validation layer and Mesa drivers (including
      # the lavapipe CPU driver; the runner has no GPU) are free Ubuntu
      # packages, so the RHI tests run here instead of skipping.
      - name: Install Vulkan loader, lavapipe, validation layer and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          if [ "${{ matrix.preset }}" = "linux-analysis" ]; then
            sudo apt-get install -y clang-tidy-18
          fi
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build and analyze
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Stage and run CLI
        run: |
          cmake --install build/${{ matrix.preset }} --prefix out/${{ matrix.preset }}
          bin=./out/${{ matrix.preset }}/bin/lyko
          "$bin" --version
          "$bin" test --source . --preset ${{ matrix.preset }}
          "$bin" run
          expect_exit() {
            expected=$1
            shift
            status=0
            "$@" || status=$?
            if [ "$status" -ne "$expected" ]; then
              echo "expected exit $expected, got $status for: $*"
              exit 1
            fi
          }
          expect_exit 3 "$bin" screenshot
          expect_exit 2 "$bin" trace
          expect_exit 3 "$bin" run --scene
          trace="$(mktemp)"
          expect_exit 0 "$bin" trace --frames 2 --output "$trace"
          if ! grep -F -q '"name":"sandbox.frame"' "$trace"; then
            echo "trace file is missing sandbox frames"
            exit 1
          fi
          rm -f "$trace"
